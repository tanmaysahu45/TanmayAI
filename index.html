<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tanmay AI</title>

    <link rel="icon" type="image/png" href="https://img.icons8.com/fluent/512/artificial-intelligence.png">
    <link rel="apple-touch-icon" href="https://img.icons8.com/fluent/512/artificial-intelligence.png">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div id="toast-container"></div>

    <div class="login-container" id="login-container">
        <div class="login-card">
            <div class="login-logo">
                <img src="https://img.icons8.com/fluent/512/artificial-intelligence.png" alt="Tanmay AI">
            </div>
            <h1>Welcome to Tanmay AI</h1>
            <p class="login-tagline">Aapki apni AI. Aapki bhasha mein. Aapke liye.</p>
            <button id="google-login-btn">
                <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google">
                Sign in with Google
            </button>
            <p class="login-credit">Made by Tanmay Sahu</p>
        </div>
    </div>

    <div class="app-container hidden" id="app-container">

        <div class="sidebar-overlay" id="sidebar-overlay"></div>

        <aside class="sidebar collapsed" id="sidebar">
            <div class="sidebar-content">
                <button class="new-chat-btn" id="new-chat-btn">
                    <i class="fa-solid fa-plus"></i> New Chat
                </button>

                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="chat-search-input" placeholder="Search chats...">
                </div>

                <div class="history-container">
                    <h3>Chat History</h3>
                    <div id="history-list"></div>
                </div>

                <div class="sidebar-footer">
                    <button id="clear-history-btn">
                        <i class="fa-solid fa-trash"></i> Clear All History
                    </button>
                    <div class="user-profile">
                        <img id="user-avatar" src="" alt="User" style="width:28px; height:28px; border-radius:50%; display:none;">
                        <i id="default-user-icon" class="fa-solid fa-user-circle" style="font-size:20px;"></i>
                        <span id="username-display">Loading...</span>
                        <button id="logout-btn" title="Logout">
                            <i class="fa-solid fa-right-from-bracket"></i>
                        </button>
                    </div>
                </div>
            </div>
        </aside>

        <main class="chat-area">
            <header class="chat-header">
                <div class="header-left">
                    <button id="sidebar-toggle-btn" title="Menu">
                        <i class="fa-solid fa-bars"></i>
                    </button>
                    <div class="brand">
                        <div class="brand-logo">T</div>
                        <h2>Tanmay AI</h2>
                    </div>
                </div>
                <div class="header-right">
                    <button id="theme-toggle-btn" title="Theme">
                        <i class="fa-solid fa-sun"></i>
                    </button>
                    <button id="toggle-voice-btn" title="Voice">
                        <i class="fa-solid fa-volume-high"></i>
                    </button>
                </div>
            </header>

            <div class="messages-container" id="messages-container"></div>

            <footer class="chat-footer">
                <div class="input-wrapper">
                    <button id="mic-btn" title="Speak">
                        <i class="fa-solid fa-microphone"></i>
                    </button>
                    <input type="text" id="user-input" placeholder="Ask Tanmay AI..." autocomplete="off">
                    <button id="send-btn" title="Send">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </div>
                <div class="footer-credit">Made by Tanmay Sahu • 2025</div>
            </footer>
        </main>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
