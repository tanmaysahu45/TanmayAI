<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#131314">
    <meta name="description" content="Tanmay AI - Your personal AI assistant by Tanmay Sahu">
    <title>Tanmay AI</title>

    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="https://img.icons8.com/fluent/512/artificial-intelligence.png">
    <link rel="apple-touch-icon" href="https://img.icons8.com/fluent/512/artificial-intelligence.png">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Tanmay AI">
    <meta name="mobile-web-app-capable" content="yes">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div id="toast-container"></div>

    <!-- LOGIN -->
    <div class="login-container" id="login-container">
        <div class="login-card">
            <div class="login-logo">
                <img src="https://img.icons8.com/fluent/512/artificial-intelligence.png" alt="Tanmay AI">
            </div>
            <h1>Welcome to Tanmay AI</h1>
            <p class="login-tagline">Aapki apni AI. Aapki bhasha mein. Aapke liye.</p>
            <button id="google-login-btn">
                <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google">
                Sign in with Google
            </button>
            <p class="login-credit">Made by Tanmay Sahu</p>
        </div>
    </div>

    <!-- APP -->
    <div class="app-container hidden" id="app-container">

        <div class="sidebar-overlay" id="sidebar-overlay"></div>

        <!-- SIDEBAR -->
        <aside class="sidebar collapsed" id="sidebar">
            <div class="sidebar-content">

                <div class="sidebar-top">
                    <button class="new-chat-btn" id="new-chat-btn">
                        <i class="fa-solid fa-plus"></i>
                        <span>New Chat</span>
                    </button>
                    <button class="sidebar-close-btn" id="sidebar-close-btn" title="Close">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>

                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="chat-search-input" placeholder="Search chats...">
                </div>

                <div class="history-container">
                    <h3>Recent</h3>
                    <div id="history-list"></div>
                </div>

                <div class="sidebar-footer">
                    <button class="settings-btn" id="open-settings-btn">
                        <i class="fa-solid fa-gear"></i>
                        <span>Settings</span>
                    </button>
                    <div class="user-profile" id="user-profile-btn">
                        <img id="user-avatar" src="" alt="User" style="width:32px; height:32px; border-radius:50%; display:none;">
                        <i id="default-user-icon" class="fa-solid fa-user-circle" style="font-size:22px;"></i>
                        <div class="user-info">
                            <span id="username-display">Loading...</span>
                            <small id="useremail-display">...</small>
                        </div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- CHAT -->
        <main class="chat-area">
            <header class="chat-header">
                <div class="header-left">
                    <button id="sidebar-toggle-btn" title="Menu">
                        <i class="fa-solid fa-bars"></i>
                    </button>
                    <div class="brand">
                        <div class="brand-logo">T</div>
                        <h2>Tanmay AI</h2>
                    </div>
                </div>
                <div class="header-right">
                    <button id="theme-toggle-btn" title="Theme">
                        <i class="fa-solid fa-sun"></i>
                    </button>
                    <button id="toggle-voice-btn" title="Voice">
                        <i class="fa-solid fa-volume-high"></i>
                    </button>
                    <button id="header-menu-btn" title="More">
                        <i class="fa-solid fa-ellipsis-vertical"></i>
                    </button>
                </div>
            </header>

            <div class="messages-container" id="messages-container"></div>

            <footer class="chat-footer">
                <div class="input-wrapper">
                    <button id="mic-btn" title="Speak">
                        <i class="fa-solid fa-microphone"></i>
                    </button>
                    <input type="text" id="user-input" placeholder="Ask Tanmay AI..." autocomplete="off">
                    <button id="send-btn" title="Send">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </div>
                <div class="footer-credit">Made by Tanmay Sahu</div>
            </footer>
        </main>
    </div>

    <!-- SETTINGS MODAL -->
    <div class="settings-overlay hidden" id="settings-overlay">
        <div class="settings-panel">
            <div class="settings-header">
                <h2><i class="fa-solid fa-gear"></i> Settings</h2>
                <button class="settings-close" id="close-settings-btn">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div class="settings-body">

                <section class="settings-section">
                    <h3>Account</h3>
                    <div class="account-card">
                        <img id="settings-avatar" src="" alt="" style="display:none;">
                        <i id="settings-default-icon" class="fa-solid fa-user-circle"></i>
                        <div class="account-info">
                            <strong id="settings-username">User</strong>
                            <small id="settings-useremail">email</small>
                        </div>
                    </div>
                </section>

                <section class="settings-section" id="install-section">
                    <h3>App</h3>
                    <button class="settings-install-btn" id="settings-install-btn">
                        <i class="fa-solid fa-download"></i>
                        <div>
                            <strong>Install Tanmay AI</strong>
                            <small>App ki tarah phone mein lagao</small>
                        </div>
                    </button>
                    <p class="install-hint" id="install-hint" style="display:none;"></p>
                </section>

                <section class="settings-section">
                    <h3>Appearance</h3>
                    <div class="settings-row">
                        <label><i class="fa-solid fa-moon"></i> Theme</label>
                        <select id="setting-theme">
                            <option value="dark">Dark</option>
                            <option value="light">Light</option>
                        </select>
                    </div>
                    <div class="settings-row">
                        <label><i class="fa-solid fa-language"></i> Language</label>
                        <select id="setting-language">
                            <option value="auto">Auto (Smart)</option>
                            <option value="hinglish">Hinglish</option>
                            <option value="hindi">हिंदी</option>
                            <option value="english">English</option>
                        </select>
                    </div>
                </section>

                <section class="settings-section">
                    <h3>Voice</h3>
                    <div class="settings-row">
                        <label><i class="fa-solid fa-volume-high"></i> Voice Replies</label>
                        <label class="switch">
                            <input type="checkbox" id="setting-voice-toggle" checked>
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div class="settings-row">
                        <label><i class="fa-solid fa-microphone"></i> Auto Send Voice</label>
                        <label class="switch">
                            <input type="checkbox" id="setting-autosend-voice" checked>
                            <span class="slider"></span>
                        </label>
                    </div>
                </section>

                <section class="settings-section">
                    <h3>Data</h3>
                    <button class="settings-danger-btn" id="settings-clear-history">
                        <i class="fa-solid fa-trash"></i> Clear All Chat History
                    </button>
                    <button class="settings-danger-btn" id="settings-clear-memory">
                        <i class="fa-solid fa-brain"></i> Clear Personal Memory
                    </button>
                </section>

                <section class="settings-section">
                    <h3>About</h3>
                    <div class="about-block">
                        <div class="about-logo">T</div>
                        <div>
                            <strong>Tanmay AI</strong>
                            <small>Version 2.1</small>
                            <small>Made by Tanmay Sahu</small>
                        </div>
                    </div>
                </section>

                <section class="settings-section">
                    <button class="settings-logout-btn" id="settings-logout-btn">
                        <i class="fa-solid fa-right-from-bracket"></i> Sign Out
                    </button>
                </section>

            </div>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
